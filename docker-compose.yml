# llama.cpp server on GPU. Everything configurable lives in .env (copy it from
# .env.example). Changing models does not require editing this file.
services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: ${CONTAINER_NAME:-llama}

    # Deliberately "no": the model holds nearly all of the VRAM, and starting it
    # on every reboot would keep the card busy even on days it is needed for
    # training. Bring it up by hand with scripts/serve.sh up.
    restart: "no"

    # Bind address is configurable through BIND (.env). Loopback by default;
    # setting the tailscale IP exposes it to the tailnet without opening it to
    # the internet. See the README.
    ports:
      - "${BIND:-127.0.0.1}:${PORT:-8080}:8080"

    # :ro — the server only ever reads the .gguf files. This keeps a bug or a
    # mistyped command inside the container from touching models that took hours
    # to download.
    volumes:
      - ${MODELS_DIR:?MODELS_DIR is missing from .env}:/models:ro

    # The compose equivalent of `docker run --gpus all`. Requires
    # nvidia-container-toolkit on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # The image ENTRYPOINT is already /app/llama-server, so everything below is
    # a llama-server flag rather than a Docker one. Explained one by one in the
    # README.
    #
    # API_KEY uses the same "if set" interpolation as the DRAFT_* lines: leave it
    # empty and the server stays open, which is the right default for a port
    # bound to loopback. Set it and every request must carry
    # `Authorization: Bearer <key>`. Required before exposing the server beyond
    # a trusted network -- there is no other authentication. README section 7.
    #
    # The two DRAFT_* lines below use compose's "if set" interpolation, so they
    # vanish entirely when the variable is empty: an external draft head is
    # opt-in and costs nothing when unused. They are
    # for the case SPEC_TYPE alone cannot express: a drafter that lives in its
    # own file, such as a DFlash head or a grafted MTP head. README section 4.
    #
    # -ncmoe keeps the expert tensors of the first N blocks in host RAM instead
    # of VRAM. The default 0 offloads nothing, so this line changes nothing for
    # a dense model or a card the weights already fit on. It is what lets a MoE
    # far larger than the GPU run at a usable speed: only the active experts are
    # read per token. See README section 5.
    command: >
      -m /models/${MODEL_FILE:?MODEL_FILE is missing from .env}
      --alias ${MODEL_ALIAS:-local-model}
      --host 0.0.0.0 --port 8080
      ${API_KEY:+--api-key} ${API_KEY:-}
      -c ${CTX:-65536}
      -ngl ${NGL:-all}
      -ncmoe ${N_CPU_MOE:-0}
      -np 1 -b ${BATCH:-2048} -ub ${UBATCH:-512}
      -ctk ${KV_TYPE_K:-${KV_TYPE:-q8_0}} -ctv ${KV_TYPE_V:-${KV_TYPE:-q8_0}}
      -fa on
      --temp ${TEMP:-0.6} --top-p ${TOP_P:-0.95}
      --top-k ${TOP_K:-20} --min-p ${MIN_P:-0.0}
      --jinja
      --reasoning-format ${REASONING_FORMAT:-deepseek}
      --metrics
      --cache-ram ${CACHE_RAM:-8192}
      --spec-type ${SPEC_TYPE:-draft-mtp}
      --spec-draft-n-max ${SPEC_N_MAX:-8}
      --spec-draft-p-min ${SPEC_P_MIN:-0.7}
      ${DRAFT_MODEL:+--spec-draft-model /models/${DRAFT_MODEL}}
      ${DRAFT_NGL:+--spec-draft-ngl ${DRAFT_NGL}}

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      # Generous on purpose: loading 18 GB from disk into VRAM takes a while the
      # first time around.
      start_period: 300s
      retries: 5

  # ---------------------------------------------------------------------------
  # Fill-in-the-middle completion server, for an editor plugin rather than a
  # chat client. Behind a compose profile, so `docker compose up -d` and
  # scripts/serve.sh up leave it alone: it is started explicitly with
  # `scripts/serve.sh fim up`.
  #
  # It is a different job from the service above and the flags reflect that.
  # No --jinja, no --reasoning-format and no sampling values, because the
  # editor talks to /infill rather than /v1/chat/completions and llama.cpp
  # builds the FIM prompt from the model's own special tokens. The batch sizes
  # are equal on purpose: a completion re-sends a whole window of surrounding
  # code, so the work is prefill-bound, and an ubatch below the batch buys
  # nothing while adding a second pass.
  #
  # This must be a BASE model. The instruct-tuned sibling of the same weights
  # has no FIM tokens and returns chat prose in the middle of a function.
  fim:
    profiles: ["fim"]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: ${FIM_CONTAINER_NAME:-llama-fim}
    restart: "no"

    # Loopback by default, like the chat service. The editor runs on this same
    # machine; widening it is a security decision, and there is no auth here
    # either.
    ports:
      - "${FIM_BIND:-127.0.0.1}:${FIM_PORT:-8012}:8012"

    volumes:
      - ${MODELS_DIR:?MODELS_DIR is missing from .env}:/models:ro

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # -c 0 means "whatever the model was trained for" rather than "unlimited".
    # --cache-reuse N lets the server keep a prefix of the KV cache when the
    # next request shares it up to a gap of N tokens. Typing inside a file
    # changes a little and leaves most of the window identical, so this is what
    # separates a completion that feels instant from one that re-reads the file
    # on every keystroke.
    command: >
      -m /models/${FIM_MODEL_FILE:?FIM_MODEL_FILE is missing from .env}
      --alias ${FIM_MODEL_ALIAS:-fim-model}
      --host 0.0.0.0 --port 8012
      -c ${FIM_CTX:-0}
      -ngl ${FIM_NGL:-all}
      -np 1 -b ${FIM_BATCH:-1024} -ub ${FIM_UBATCH:-1024}
      --cache-reuse ${FIM_CACHE_REUSE:-256}
      -fa on
      --metrics

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8012/health || exit 1"]
      interval: 10s
      timeout: 5s
      # Far shorter than the chat service's: this model is under 2 GB.
      start_period: 60s
      retries: 5
